name: 'Secret Scan Triage'
description: 'Turn noisy secret-scan alerts into real findings vs noise (tests, rule files, docs, artifacts). Local-only, no network.'
author: 'zjdyzww'
branding:
  icon: 'shield'
  color: 'purple'
inputs:
  report:
    description: 'Path to your scanner report (gitleaks JSON / SARIF / text with path:line)'
    required: true
  repo-root:
    description: 'Repository root used to resolve paths in the report'
    required: false
    default: '.'
  fail-on-real:
    description: 'Fail the step when at least one real finding is found (true/false)'
    required: false
    default: 'true'
  output:
    description: 'Where to write the triage result (markdown)'
    required: false
    default: 'secret-triage-report.md'
  pr-comment:
    description: 'If true and running on a pull_request event, post/update a sticky comment with the triage summary'
    required: false
    default: 'false'
  sarif-output:
    description: 'If set, write a SARIF file containing ONLY the real findings (for upload-sarif / code scanning).'
    required: false
    default: ''
outputs:
  real:
    description: 'Number of findings judged real'
    value: ${{ steps.triage.outputs.real }}
  triaged:
    description: 'Number of findings excluded by context'
    value: ${{ steps.triage.outputs.triaged }}
runs:
  using: 'composite'
  steps:
    - name: Checkout triage tool
      shell: bash
      run: |
        set -euo pipefail
        git clone --depth 1 https://github.com/zjdyzww/ai-code-health.git "$RUNNER_TEMP/ai-code-health"
    - name: Run triage
      id: triage
      shell: bash
      env:
        REPORT: ${{ inputs.report }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ github.token }}   # gh CLI 在 Actions 里必须显式给 token
        ROOT: ${{ inputs.repo-root }}
        OUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        node "$RUNNER_TEMP/ai-code-health/review.mjs" "$ROOT" --from-report "$REPORT" > "$OUT" || RC=$?
        RC=${RC:-0}
        # 从 JSON 里取计数（--json 输出最稳）
        node "$RUNNER_TEMP/ai-code-health/review.mjs" "$ROOT" --from-report "$REPORT" --json > /tmp/triage.json || true
        REAL=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('/tmp/triage.json','utf8')).measures.real)}catch{console.log('0')}")
        TRIAGED=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('/tmp/triage.json','utf8')).measures.triaged)}catch{console.log('0')}")
        echo "real=$REAL" >> "$GITHUB_OUTPUT"
        echo "triaged=$TRIAGED" >> "$GITHUB_OUTPUT"
        {
          echo "### Secret scan triage"
          echo ""
          echo "- **real findings: ${REAL}**"
          echo "- excluded by context: ${TRIAGED}"
          echo ""
          sed -n '1,40p' "$OUT"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ -n "${{ inputs.sarif-output }}" ]; then
          SARIF="${{ inputs.sarif-output }}" node -e '
            const fs = require("fs");
            const t = JSON.parse(fs.readFileSync("/tmp/triage.json", "utf8"));
            const results = (t.real || []).map((label) => {
              const m = String(label).match(/^(.*?):(\d+)/);
              const file = m ? m[1] : String(label);
              const line = m ? Number(m[2]) : 1;
              return {
                ruleId: "secret-triage/real-secret",
                level: "error",
                message: { text: "Real secret finding (excluded noise not shown): " + label },
                locations: [{ physicalLocation: { artifactLocation: { uri: file }, region: { startLine: line } } }],
              };
            });
            const sarif = {
              $schema: "https://json.schemastore.org/sarif-2.1.0.json",
              version: "2.1.0",
              runs: [{
                tool: { driver: { name: "secret-triage", informationUri: "https://github.com/zjdyzww/secret-triage-action", rules: [{ id: "secret-triage/real-secret", shortDescription: { text: "Real secret finding" } }] } },
                results,
              }],
            };
            fs.writeFileSync(process.env.SARIF, JSON.stringify(sarif, null, 2));
            console.log("SARIF written:", process.env.SARIF, "results:", results.length);
          '
        fi
        if [ "${{ inputs.pr-comment }}" = "true" ] && [ -n "${PR_NUMBER:-}" ]; then
          MARKER='<!-- secret-triage -->'
          BODY_FILE=$(mktemp)
          {
            echo "$MARKER"
            echo "### Secret scan triage"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| real findings | **${REAL}** |"
            echo "| excluded by context | ${TRIAGED} |"
            echo ""
            if [ "$REAL" != "0" ]; then
              echo "**Action needed:** rotate the credential(s) below FIRST, then fix the code."
              echo ""
            fi
            echo "<details><summary>Full triage</summary>"
            echo ""
            echo '```'
            sed -n '1,60p' "$OUT"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "_6 buckets: test fixture · scanner rule file · doc/template · build artifact · detector source · knowledge snapshot_"
          } > "$BODY_FILE"
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1 || true)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING}" -F body=@"$BODY_FILE" >/dev/null
            echo "updated PR comment ${EXISTING}"
          else
            gh pr comment "$PR_NUMBER" --body-file "$BODY_FILE" >/dev/null
            echo "created PR comment on #${PR_NUMBER}"
          fi
        fi
        if [ "${{ inputs.fail-on-real }}" = "true" ] && [ "$REAL" != "0" ]; then
          echo "::error::${REAL} real secret finding(s) need rotation (revoke first, then edit code)"
          exit 1
        fi
